version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    groups:
      spring:
        patterns:
          - "org.springframework*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # stay on the Java 21 LTS until the build image moves too
      - dependency-name: eclipse-temurin
        update-types: ["version-update:semver-major"]
